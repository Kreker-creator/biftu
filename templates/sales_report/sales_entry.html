{% extends "base.html" %}
{% block content %}
    <form method="POST" action="" class="max-w-xl mx-auto mt-10 bg-green-50 p-6 rounded-lg shadow-lg mt-10">
        {% csrf_token %}
        
        <h2 class="text-2xl font-semibold text-green-800 font-mono mb-6 text-center">Enter an Order</h2>
      
        <div class="mb-4">
          <label class="block text-green-700 font-semibold font-mono mb-1">Full Name</label>
          <input type="text" name="full_name" class="w-full border border-green-300 rounded px-4 py-2 font-mono" required>
        </div>
      
        <div class="mb-4">
          <label class="block text-green-700 font-semibold font-mono mb-1">Phone Number</label>
          <input type="text" name="phone_number" class="w-full border border-green-300 rounded px-4 py-2 font-mono" required>
        </div>
      
        <div class="mb-4">
          <label class="block text-green-700 font-semibold font-mono mb-1">Quantity</label>
          <input type="number" name="quantity" class="w-full border border-green-300 rounded px-4 py-2 font-mono" min="1" required>
        </div>
      
        <div class="mb-4">
          <label class="block text-green-700 font-semibold font-mono mb-1">Description</label>
          <textarea name="description" class="w-full border border-green-300 rounded px-4 py-2 font-mono" rows="3"></textarea>
        </div>
      
        <div class="mb-4">
          <label class="block text-green-700 font-semibold font-mono mb-1">Payment Status</label>
          <select name="payment_status" class="w-full border border-green-300 rounded px-4 py-2 font-mono">
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      
        <div class="mb-4">
          <label class="block text-green-700 font-semibold font-mono mb-1">Comments</label>
          <textarea name="comments" class="w-full border border-green-300 rounded px-4 py-2 font-mono" rows="2"></textarea>
        </div>
      
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg font-mono">
          Submit Order
        </button>
      </form>
      
       <!-- Footer
  <footer class="text-center py-6 bg-green-100 font-mono sticky text-green-700">
    © 2025 Biftu natural oil. All rights reserved.
  </footer>
   -->
  
{% endblock %}
